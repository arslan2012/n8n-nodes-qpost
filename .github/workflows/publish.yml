# Publishes n8n-nodes-qpost to npm on every version tag, with npm provenance.
#
# Authentication is npm Trusted Publishing (OIDC): npm checks the request came
# from this repository and this workflow file, so no npm token exists anywhere
# — nothing to leak, and nothing to break when npm stops accepting tokens
# that bypass 2FA. Provenance is attached automatically, which n8n requires
# for community nodes published after May 1 2026.
#
# One-time setup (done once by the package owner, with npm 2FA):
#   1. First publish from a local machine, since npm can only attach a trusted
#      publisher to a package that already exists:
#        npm run build && RELEASE_MODE=1 npm publish --access public
#   2. Link the package to this workflow:
#        npm trust github n8n-nodes-qpost --file publish.yml \
#          --repo arslan2012/n8n-nodes-qpost --allow-publish
#
# To release: bump "version" in package.json, commit, then push a matching tag
# (e.g. `git tag 0.1.1 && git push --tags`).

name: Publish

on:
  push:
    tags:
      - '*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      # Mints the OIDC token npm exchanges for a short-lived publish credential.
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Trusted publishing needs Node >= 22.14 and npm >= 11.5.1.
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Upgrade npm
        run: npm install -g npm@latest && npm --version

      - name: Check the tag matches package.json
        run: |
          PKG="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$PKG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      # Lints, builds, then `npm publish` with provenance (n8n-node release
      # detects GitHub Actions and switches to publish mode).
      - name: Release
        run: npm run release
